<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f3a8a">
<title>Admin · AA Exam Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface2:#f7f8fb; --ink:#14171f; --muted:#667085; --line:#e4e7ee;
  --brand:#2b45b8; --brand2:#4a63d8; --brandSoft:#e9edfc;
  --a:#2563eb; --aSoft:#e3ecfe; --b:#7c3aed; --bSoft:#efe7fd;
  --ok:#0f8a5f; --okSoft:#e1f5ec; --bad:#c2372f; --badSoft:#fbe9e7; --flag:#c26a04; --flagSoft:#fdf1dc;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.05); --r:16px;
}
:root[data-theme="dark"]{
  --bg:#0d0f14; --surface:#161a22; --surface2:#1c212b; --ink:#eceef4; --muted:#9aa3b5; --line:#262c38;
  --brand:#8ea2ff; --brand2:#a9b8ff; --brandSoft:#1d2442;
  --a:#6ea0ff; --aSoft:#16264a; --b:#b794ff; --bSoft:#271c45;
  --ok:#3fcf8e; --okSoft:#10302a; --bad:#ff7a70; --badSoft:#3a1b1a; --flag:#f5a524; --flagSoft:#3a2a0f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f14; --surface:#161a22; --surface2:#1c212b; --ink:#eceef4; --muted:#9aa3b5; --line:#262c38;
    --brand:#8ea2ff; --brand2:#a9b8ff; --brandSoft:#1d2442;
    --a:#6ea0ff; --aSoft:#16264a; --b:#b794ff; --bSoft:#271c45;
    --ok:#3fcf8e; --okSoft:#10302a; --bad:#ff7a70; --badSoft:#3a1b1a; --flag:#f5a524; --flagSoft:#3a2a0f;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.shell{min-height:100vh}
body.authed .shell{display:grid;grid-template-columns:252px minmax(0,1fr)}
.side{display:none}
body.authed .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px;font-weight:800;letter-spacing:-.01em}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#6d4bd8);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:18px;flex:none}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.navl{display:flex;flex-direction:column;gap:4px}
.navl button{display:flex;align-items:center;gap:11px;border:0;background:none;border-radius:11px;padding:11px 12px;font-weight:650;color:var(--muted);text-align:left}
.navl button:hover{background:var(--surface2);color:var(--ink)}
.navl button.on{background:var(--brandSoft);color:var(--brand)}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.mecard{display:flex;align-items:center;gap:10px;min-width:0}
.mecard .t{min-width:0}
.mecard b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mecard small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meact{display:flex;gap:8px}
.meact .btn{flex:1;min-width:0;padding:9px 8px}
.topbar{display:none}
.main{min-width:0}
#app{max-width:1180px;margin:0 auto;padding:28px 28px 60px}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;object-fit:cover}
img.av{background:var(--surface2)}
.av.lg{width:60px;height:60px;font-size:22px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:650;font-size:13.5px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d0f14}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:wait}
.icn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.icn:hover{color:var(--ink);border-color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--brand);font-weight:700;padding:4px 0;margin-bottom:12px}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:14px;min-height:42px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--brandSoft);border-color:var(--brand)}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{width:100%;padding-left:38px}

/* ---------- page parts ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-family:Fraunces,serif;font-size:30px;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;gap:13px;align-items:center;min-width:0}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brandSoft);color:var(--brand)}
.kpi .ico.a{background:var(--aSoft);color:var(--a)} .kpi .ico.b{background:var(--bSoft);color:var(--b)} .kpi .ico.g{background:var(--okSoft);color:var(--ok)}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:18px;min-width:0}
.card>h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.err{background:var(--badSoft);color:var(--bad);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .ic{width:34px;height:34px;opacity:.5;margin-bottom:8px}
.tag{display:inline-block;font-weight:800;font-size:11.5px;padding:2px 10px;border-radius:99px}
.tag.a{background:var(--aSoft);color:var(--a)} .tag.b{background:var(--bSoft);color:var(--b)}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.s{background:var(--okSoft);color:var(--ok)} .pill.w{background:var(--badSoft);color:var(--bad)}
.over{color:var(--flag);font-weight:700}
.skel i{display:block;height:46px;border-radius:11px;margin:9px 0;background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- tables (become cards on phones) ---------- */
.tw{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse;font-size:13.5px}
.rt th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
.rt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tbody tr:last-child td{border-bottom:0}
.rt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt tr.click{cursor:pointer}
.rt tr.click:hover td{background:var(--surface2)}
.rt tr.total td{background:var(--surface2);font-weight:700}
.cv{display:block}
.rt td[data-l*="Date"],.rt td[data-l="Last active"],.rt td[data-l="Last login"]{white-space:nowrap}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.who b{display:block}
.who small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
td small.sub2{display:block;color:var(--muted);font-size:11.5px}
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px;min-width:70px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}

/* ---------- student profile ---------- */
.prof{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.prof h1{font-family:Fraunces,serif;font-size:28px}
.prof .grow{flex:1;min-width:220px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;color:var(--muted)}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;background:var(--c)}

/* ---------- PDF page ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:13px}
.form label input{font-weight:400}
.form .full{grid-column:1/-1}
.hint{margin:0;color:var(--muted);font-size:12.5px}
.hint code{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.prow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0;padding-bottom:0}
.pic{width:44px;height:44px;border-radius:12px;background:var(--badSoft);color:var(--bad);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.05em;flex:none}
.pmain{flex:1;min-width:0}
.pmain b{display:block}
.pmain span{display:block;color:var(--muted);font-size:13px}
.pmain .lnk{font-size:12px;color:var(--brand);word-break:break-all}
.pact{display:flex;gap:8px;flex:none}

/* ---------- gate + toast ---------- */
.gate{max-width:410px;margin:14vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:34px 28px;box-shadow:var(--shadow);text-align:center}
.gate .mark{margin:0 auto 14px;width:46px;height:46px;font-size:22px}
.gate h2{font-family:Fraunces,serif;font-size:26px;margin-bottom:8px}
.gate p{color:var(--muted);margin:0 0 22px}
.gate .btn{padding:12px 20px;font-size:15px}
.gate .msg{margin-top:14px;font-size:13.5px;color:var(--bad)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:650;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- tablet ---------- */
@media(max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- mobile ---------- */
@media(max-width:900px){
  body.authed .shell{display:block}
  body.authed .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px)}
  .side .brand,.side .me{display:none}
  .navl{flex-direction:row;flex:1;gap:6px}
  .navl button{flex:1;flex-direction:column;gap:3px;padding:8px 6px;font-size:11.5px;align-items:center;justify-content:center;text-align:center}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  body:not(.authed) .topbar{display:none}
  .topbar .brand{padding:0;font-size:15px;flex:1;min-width:0}
  .topbar .mark{width:32px;height:32px;font-size:16px}
  .topbar .row{display:flex;gap:8px}
  #app{padding:18px 14px calc(96px + env(safe-area-inset-bottom))}
  .ph h1,.prof h1{font-size:24px}
  .ph{align-items:flex-start}
  .acts{width:100%}.acts .btn{flex:1}
  .card{padding:14px}
  .form{grid-template-columns:1fr}
  #toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  .gate{margin-top:8vh}
}
@media(max-width:720px){
  .kpi{padding:13px;gap:10px}.kpi b{font-size:18px}.kpi .ico{width:36px;height:36px}
  .search{min-width:100%}.toolbar select{flex:1}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:10px 12px;background:var(--surface)}
  .rt tr.click:active{background:var(--surface2)}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 0;border:0;text-align:right}
  .rt td::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none}
  .rt td.primary{display:block;text-align:left;padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .rt td.primary::before{display:none}
  .rt td.hm{display:none}
  .rt td .cv{text-align:right}
  .prof{align-items:flex-start;gap:12px}.prof .av.lg{width:48px;height:48px;font-size:18px}.prof .grow{min-width:0;flex:1}
  .rt tr.total{background:var(--surface2)}
  .rt tr.total td{background:none}
  .rt tr.click:hover td{background:none}
  .meter{min-width:0;width:100%}
  .rt td .meterwrap{flex:1;min-width:0;text-align:right}
  .prow{flex-wrap:wrap}.pact{width:100%}.pact .btn{flex:1}
}
@media(max-width:380px){ .kpis{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="mark">Y</span><span>AA Exam Practice<small>Admin console</small></span></div>
    <nav class="navl" id="nav">
      <button data-nav="students"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Students</span></button>
      <button data-nav="pdfs"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>PDF library</span></button>
    </nav>
    <div class="me" id="who"></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="brand"><span class="mark">Y</span><span>Admin console<small>AA Exam Practice</small></span></div><div class="row" id="whoTop"></div></header>
    <main id="app"><div class="gate"><p style="margin:0">Loading…</p></div></main>
  </div>
</div>
<div id="toast" role="status"></div>
<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDZVvHO_hlM51j2qTeGKfGLpH8t_YTSLDU",
  authDomain: "aa-exam-practice.firebaseapp.com",
  projectId: "aa-exam-practice",
  storageBucket: "aa-exam-practice.firebasestorage.app",
  messagingSenderId: "348006785291",
  appId: "1:348006785291:web:621592fb02be5a24cf020e",
  measurementId: "G-LJE8YG75GL"
};
// Must match isAdmin() in firestore.rules (lowercase).
const ADMIN_EMAILS = ['akshat.y.shah1725@gmail.com','yateseducationaccaresource@gmail.com'];

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const appEl=$('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const adminEmails=ADMIN_EMAILS.map(e=>String(e).trim().toLowerCase());
const isAdmin=u=>!!(u&&u.email&&adminEmails.includes(u.email.toLowerCase()));
let FB=null, auth=null, db=null, user=null, view='students';

const P={
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
  ext:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  pulse:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

const fmtT=s=>{s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:m?`${m}m ${String(x).padStart(2,'0')}s`:`${x}s`;};
const when=ms=>ms?new Date(ms).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const whenShort=ms=>ms?new Date(ms).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'—';
const tsMs=v=>v&&v.toMillis?v.toMillis():(v?(typeof v==='number'?v:Date.parse(v)||0):0);
const pct=(a,b)=>b?Math.round(a/b*100):null;
const pctTxt=v=>v==null?'—':v+'%';
const skel=(n=5)=>'<div class="skel">'+Array.from({length:n},()=>'<i></i>').join('')+'</div>';
const empty=(icon,t)=>`<div class="empty">${ic(icon)}<div>${esc(t)}</div></div>`;
let toastT; function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }
const ph=(title,sub,actions)=>`<div class="ph"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${actions?`<div class="acts">${actions}</div>`:''}</div>`;
const kpi=(icon,tone,val,label,sub)=>`<div class="kpi"><div class="ico ${tone}">${ic(icon)}</div><div style="min-width:0"><b>${val}</b><span>${label}</span>${sub?`<small>${sub}</small>`:''}</div></div>`;

function friendlyError(e){
  const c=(e&&e.code)||'';
  const map={
    'auth/unauthorized-domain':"This website's domain isn't authorised. Firebase Console → Authentication → Settings → Authorized domains → add it.",
    'auth/operation-not-allowed':"Google sign-in isn't enabled. Firebase Console → Authentication → Sign-in method → enable Google.",
    'auth/network-request-failed':'Network error. Check your internet connection.',
    'auth/too-many-requests':'Too many attempts. Wait a little and try again.',
    'permission-denied':'Firestore denied access. Publish firestore.rules and make sure your email is listed as admin there.',
    'unavailable':'Firestore is unreachable right now. Check your connection.'
  };
  return map[c]||(e&&e.message)||'Something went wrong.';
}
function dl(name,rows){
  const csv=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('CSV downloaded');
}

/* ---------- students ---------- */
const adm={students:[],sel:null,rows:[],loading:false,err:'',q:'',sort:'active',f:{sec:'',topic:'',q:''},limit:100};
function adminError(e){ return (e&&e.code==='permission-denied')?'Firestore denied access. Publish firestore.rules and make sure your admin email is listed in the rules.':friendlyError(e); }
const sName=s=>s.student||s.displayName||s.email;
const sActive=s=>Math.max(s.lastActivityAt||0,tsMs(s.lastSeenAt));

async function loadStudents(){
  adm.loading=true; adm.err=''; renderAdmin();
  try{ const snap=await FB.getDocs(FB.collection(db,'users')); adm.students=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.email); }
  catch(e){ console.error(e); adm.err=adminError(e); }
  adm.loading=false; renderAdmin();
}
async function openStudent(id){
  const s=adm.students.find(x=>x.id===id); if(!s) return;
  adm.sel=s; adm.rows=[]; adm.f={sec:'',topic:'',q:''}; adm.limit=100; adm.loading=true; adm.err=''; renderAdmin(); window.scrollTo(0,0);
  try{
    const snap=await FB.getDocs(FB.query(FB.collection(db,'attempts'),FB.where('uid','==',id)));
    adm.rows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.t||0)-(a.t||0));
  }catch(e){ console.error(e); adm.err=adminError(e); }
  adm.loading=false; renderAdmin();
}
function renderAdmin(){
  if(view!=='students') return;
  appEl.innerHTML=(adm.err?`<div class="err">${esc(adm.err)}</div>`:'')+(adm.sel?studentHTML():listHTML());
  if(!adm.sel) renderList(); else { renderTopics(); renderRows(); }
}
function listHTML(){
  const st=adm.students, week=Date.now()-7*864e5;
  const act=st.filter(s=>sActive(s)>week).length;
  const att=st.reduce((a,s)=>a+((s.stats&&(s.stats.aN+s.stats.bN))||0),0);
  const time=st.reduce((a,s)=>a+((s.stats&&s.stats.totalSecs)||0),0);
  const L=adm.loading;
  return ph('Students','Everyone who has signed in with Google, what they practised and how long it took.',
      `<button class="btn" data-adm="refresh">${ic('refresh')}<span>Refresh</span></button><button class="btn" data-adm="csvAll">${ic('download')}<span>Export CSV</span></button>`)+
  `<div class="kpis">${kpi('users','',L?'…':st.length,'Students')+kpi('pulse','g',L?'…':act,'Active (7 days)')+kpi('target','a',L?'…':att,'Questions attempted')+kpi('clock','b',L?'…':fmtT(time),'Practice time')}</div>
  <div class="card"><div class="toolbar"><label class="search">${ic('search')}<input data-admf="q" placeholder="Search name or email…" value="${esc(adm.q)}"></label>
    <select data-admf="sort" aria-label="Sort"><option value="active"${adm.sort==='active'?' selected':''}>Last active</option><option value="time"${adm.sort==='time'?' selected':''}>Total time</option><option value="qs"${adm.sort==='qs'?' selected':''}>Questions attempted</option><option value="name"${adm.sort==='name'?' selected':''}>Name</option></select></div>
  <div id="admList">${L?skel(6):''}</div></div>`;
}
function sortedStudents(){
  const q=adm.q.trim().toLowerCase();
  const r=adm.students.filter(s=>!q||(sName(s)+' '+s.email).toLowerCase().includes(q));
  const tot=s=>(s.stats&&s.stats.totalSecs)||0, qs=s=>s.stats?s.stats.aN+s.stats.bN:0;
  return r.sort({active:(a,b)=>sActive(b)-sActive(a),time:(a,b)=>tot(b)-tot(a),qs:(a,b)=>qs(b)-qs(a),name:(a,b)=>sName(a).localeCompare(sName(b))}[adm.sort]);
}
function wrapCells(box){ box.querySelectorAll('td[data-l]').forEach(td=>{ if(td.childNodes.length>1){ const s=document.createElement('span'); s.className='cv'; while(td.firstChild) s.appendChild(td.firstChild); td.appendChild(s); } }); }

    <td class="num" data-l="Section A">${t.aN} <span class="muted">· ${pctTxt(pct(t.aOk,t.aN))}</span></td><td class="num hm" data-l="A time">${fmtT(t.aSecs)}</td>
    <td class="num" data-l="Section B">${t.bN} <span class="muted">· ${pctTxt(pct(t.bScore,t.bMax))}</span></td><td class="num hm" data-l="B time">${fmtT(t.bSecs)}</td>
    <td class="num" data-l="Total time"><b>${fmtT(t.totalSecs)}</b></td></tr>`;}).join('')+`</tbody></table></div>`;

function topicAgg(rows){
  const m=new Map();
  rows.forEach(r=>{ const t=r.topic||'(none)'; let x=m.get(t); if(!x){x={A:{n:0,ok:0,s:0},B:{n:0,sc:0,mx:0,s:0}};m.set(t,x);}
    if(r.section==='B'){x.B.n++;x.B.sc+=r.score||0;x.B.mx+=r.max||0;x.B.s+=r.secs||0;} else {x.A.n++;x.A.ok+=r.correct?1:0;x.A.s+=r.secs||0;} });
  return [...m.entries()].sort((a,b)=>(b[1].A.s+b[1].B.s)-(a[1].A.s+a[1].B.s));
}
function renderTopics(){
  const box=$('admTopics'); if(!box) return;
  if(adm.loading){ box.innerHTML=skel(4); return; }
  const list=topicAgg(adm.rows);
  if(!list.length){ box.innerHTML=empty('inbox','No attempts yet.'); return; }
  const tot={aN:0,aOk:0,aS:0,bN:0,bSc:0,bMx:0,bS:0}; const grand=list.reduce((a,[,x])=>a+x.A.s+x.B.s,0)||1;
  const body=list.map(([t,x])=>{tot.aN+=x.A.n;tot.aOk+=x.A.ok;tot.aS+=x.A.s;tot.bN+=x.B.n;tot.bSc+=x.B.sc;tot.bMx+=x.B.mx;tot.bS+=x.B.s;
    const sum=x.A.s+x.B.s;
    return `<tr><td class="primary"><b>${esc(t)}</b></td>
    <td class="num" data-l="Section A">${x.A.n?`${x.A.n} Qs · ${pct(x.A.ok,x.A.n)}%`:'—'}</td>
    <td class="num" data-l="A time">${x.A.n?`${fmtT(x.A.s)}<small class="sub2">avg ${fmtT(x.A.s/x.A.n)}</small>`:'—'}</td>
    <td class="num" data-l="Section B">${x.B.n?`${x.B.n} · ${x.B.mx?pct(x.B.sc,x.B.mx)+'%':'—'}`:'—'}</td>
    <td class="num" data-l="B time">${x.B.n?fmtT(x.B.s):'—'}</td>
    <td class="num" data-l="Total time"><div class="meterwrap"><b>${fmtT(sum)}</b><div class="meter"><i style="width:${Math.round(sum/grand*100)}%"></i></div></div></td></tr>`;}).join('');
  box.innerHTML=`<div class="tw"><table class="rt"><thead><tr><th>Topic</th><th class="num">Section A</th><th class="num">A time</th><th class="num">Section B</th><th class="num">B time</th><th class="num">Total time</th></tr></thead><tbody>${body}
  <tr class="total"><td class="primary">All topics</td><td class="num" data-l="Section A">${tot.aN} Qs · ${pctTxt(pct(tot.aOk,tot.aN))}</td><td class="num" data-l="A time">${fmtT(tot.aS)}</td><td class="num" data-l="Section B">${tot.bN} · ${pctTxt(pct(tot.bSc,tot.bMx))}</td><td class="num" data-l="B time">${fmtT(tot.bS)}</td><td class="num" data-l="Total time">${fmtT(tot.aS+tot.bS)}</td></tr></tbody></table></div>`;
  wrapCells(box);
}
function studentHTML(){
  const s=adm.sel, R=adm.rows, L=adm.loading;
  const aS=R.filter(r=>r.section!=='B'), bS=R.filter(r=>r.section==='B');
  const aT=aS.reduce((a,r)=>a+(r.secs||0),0), bT=bS.reduce((a,r)=>a+(r.secs||0),0), tT=aT+bT;
  const aAcc=aS.length?pct(aS.filter(r=>r.correct).length,aS.length):null;
  const bAcc=bS.length?pct(bS.reduce((a,r)=>a+(r.score||0),0),bS.reduce((a,r)=>a+(r.max||0),0)):null;
  const topics=[...new Set(R.map(r=>r.topic).filter(Boolean))].sort();
  const aw=tT?Math.round(aT/tT*100):0;
  return `<button class="back" data-adm="back">${ic('back')}<span>All students</span></button>
  <div class="prof">${avatarOf(s,true)}<div class="grow"><h1>${esc(sName(s))}</h1><div class="muted">${esc(s.email)}</div>
    <div class="chips"><span class="chip">Member since ${whenShort(tsMs(s.createdAtAuth))}</span><span class="chip">Last login ${when(tsMs(s.lastLoginAt))}</span><span class="chip">Last active ${when(sActive(s))}</span></div></div>
    <div class="acts"><button class="btn" data-adm="refresh">${ic('refresh')}<span>Refresh</span></button><button class="btn" data-adm="csvOne">${ic('download')}<span>Export CSV</span></button></div></div>
  <div class="kpis">${kpi('clock','',L?'…':fmtT(tT),'Total time on questions')+kpi('target','a',L?'…':fmtT(aT),'Section A time',L?'':`${aS.length} attempts · ${pctTxt(aAcc)} correct`)+kpi('file','b',L?'…':fmtT(bT),'Section B time',L?'':`${bS.length} submissions · ${pctTxt(bAcc)} score`)+kpi('pulse','g',L?'…':(aS.length?fmtT(aT/aS.length):'—'),'Avg per Section A question')}</div>
  ${tT?`<div class="card"><h3>Time split</h3><div class="split"><i style="width:${aw}%;background:var(--a)"></i><i style="width:${100-aw}%;background:var(--b)"></i></div><div class="legend"><span style="--c:var(--a)">Section A · ${fmtT(aT)} (${aw}%)</span><span style="--c:var(--b)">Section B · ${fmtT(bT)} (${100-aw}%)</span></div></div>`:''}
  <div class="card"><h3>Time by topic &amp; section</h3><div id="admTopics"></div></div>
  <div class="card"><h3>Question log</h3>
    <div class="toolbar"><label class="search">${ic('search')}<input data-admf="fq" placeholder="Search question, case or topic…" value="${esc(adm.f.q)}"></label>
      <select data-admf="fsec" aria-label="Section"><option value="">All sections</option><option value="A"${adm.f.sec==='A'?' selected':''}>Section A</option><option value="B"${adm.f.sec==='B'?' selected':''}>Section B</option></select>
      <select data-admf="ftopic" aria-label="Topic"><option value="">All topics</option>${topics.map(t=>`<option${adm.f.topic===t?' selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div id="admRows"></div></div>`;
}
function filteredRows(){
  const q=adm.f.q.trim().toLowerCase();

function renderRows(){

  `</tbody></table></div><p class="muted" style="margin:12px 2px 0;font-size:12.5px">Showing ${Math.min(adm.limit,r.length)} of ${r.length}. ▲ = over the exam-pace allowance.${r.length>adm.limit?` <button class="back" style="margin:0 0 0 6px" data-adm="more">Show more</button>`:''}</p>`;
  wrapCells(box);
}

  (pdf.err?`<div class="err">${esc(pdf.err)}</div>`:'')+
  `<div class="card"><h3>Add a PDF</h3><div class="form">
    <label><span>Title</span><input id="pTitle" placeholder="e.g. Chapter 3 – Internal controls" value="${esc(keep.t)}"></label>
    <label><span>Description <span class="muted" style="font-weight:400">(optional)</span></span><input id="pDesc" placeholder="Short note for students" value="${esc(keep.d)}"></label>
    <label class="full"><span>PDF link or path</span><input id="pUrl" placeholder="pdfs/chapter3.pdf" value="${esc(keep.u)}"></label>
    <p class="hint full">Put the file in your GitHub repo (e.g. a <code>pdfs</code> folder) and enter <code>pdfs/chapter3.pdf</code>, or paste a full <code>https://…</code> link such as your GitHub Pages address. Avoid spaces in file names.</p>
    <div class="full"><button class="btn primary" data-pdf="add" ${pdf.busy?'disabled':''}>${ic('plus')}<span>${pdf.busy?'Saving…':'Add PDF'}</span></button></div></div></div>
  <div class="card"><h3>Library <span class="muted" style="font-weight:600;font-size:13px">${pdf.items.length}</span></h3>${pdf.loading?skel(3):(rows||empty('file','No PDFs yet. Add your first one above.'))}</div>`;
}
async function addPdf(){
  const title=$('pTitle').value.trim(), desc=$('pDesc').value.trim(), url=$('pUrl').value.trim().replace(/^\.\//,'');
  if(!title){ toast('Enter a title'); return; }
  if(!url){ toast('Enter the PDF link or path'); return; }
  if(!okLink(url)){ toast('Link must be https://… or a path like pdfs/file.pdf'); return; }
  try{
    pdf.busy=true; renderPdfs();
    await FB.addDoc(FB.collection(db,'pdfs'),{title,description:desc,url,kind:'link',createdAt:FB.serverTimestamp(),uploadedBy:(user.email||'').toLowerCase()});
    pdf.busy=false; pdf.err=''; ['pTitle','pDesc','pUrl'].forEach(i=>{const el=$(i); if(el) el.value='';}); toast('PDF added'); await loadPdfs();
  }catch(e){ console.error(e); pdf.busy=false; pdf.err=friendlyError(e); renderPdfs(); }
}
function editPdf(id){ const x=pdf.items.find(i=>i.id===id); if(!x) return; pdf.edit={id,title:x.title||'',description:x.description||'',url:x.url||''}; renderPdfs(); }
async function savePdfEdit(){
  const ed=pdf.edit; if(!ed) return;
  const title=ed.title.trim(), description=ed.description.trim(), url=ed.url.trim().replace(/^\.\//,'');
  if(!title){ toast('Enter a title'); return; }
  if(!url){ toast('Enter the PDF link or path'); return; }
  if(!okLink(url)){ toast('Link must be https://… or a path like pdfs/file.pdf'); return; }
  try{
    pdf.busy=true; renderPdfs();
    await FB.updateDoc(FB.doc(db,'pdfs',ed.id),{title,description,url,updatedAt:FB.serverTimestamp(),updatedBy:(user.email||'').toLowerCase()});
    pdf.busy=false; pdf.edit=null; pdf.err=''; toast('PDF updated'); await loadPdfs();
  }catch(e){ console.error(e); pdf.busy=false; pdf.err=friendlyError(e); renderPdfs(); }
}
async function delPdf(id){
  const x=pdf.items.find(i=>i.id===id); if(!x||!confirm('Remove "'+(x.title||'this PDF')+'" from the library?\n(The file itself stays in GitHub.)')) return;
  try{ await FB.deleteDoc(FB.doc(db,'pdfs',id)); pdf.err=''; toast('PDF removed'); await loadPdfs(); }
  catch(e){ console.error(e); pdf.err=friendlyError(e); renderPdfs(); }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){ const k=act.dataset.act; if(k==='out') FB.signOut(auth); else if(k==='theme') toggleTheme(); else if(k==='signin') signIn(act); return; }
  const nv=e.target.closest('[data-nav]');
  if(nv){ setNav(nv.dataset.nav); window.scrollTo(0,0); if(nv.dataset.nav==='students'){ adm.sel=null; loadStudents(); } else loadPdfs(); return; }
  const pd=e.target.closest('[data-pdf]');
  if(pd){ const k=pd.dataset.pdf; if(k==='add') addPdf(); else if(k==='del') delPdf(pd.dataset.id); else if(k==='edit') editPdf(pd.dataset.id); else if(k==='save') savePdfEdit(); else if(k==='cancel'){ pdf.edit=null; renderPdfs(); } return; }
  const b=e.target.closest('[data-adm]'); if(!b) return;
  switch(b.dataset.adm){
    case 'open': openStudent(b.dataset.id); break;
    case 'back': adm.sel=null; renderAdmin(); window.scrollTo(0,0); break;
    case 'refresh': adm.sel?openStudent(adm.sel.id):loadStudents(); break;
    case 'more': adm.limit+=200; renderRows(); break;
    case 'csvAll': dl(`students_${new Date().toISOString().slice(0,10)}.csv`,[['Name','Email','Last login','Last active','Section A attempts','Section A correct','Section A time (s)','Section B submissions','Section B score','Section B max','Section B time (s)','Total time (s)']].concat(sortedStudents().map(s=>{const t=s.stats||{};return [sName(s),s.email,when(tsMs(s.lastLoginAt)),when(sActive(s)),t.aN||0,t.aOk||0,t.aSecs||0,t.bN||0,t.bScore||0,t.bMax||0,t.bSecs||0,t.totalSecs||0];}))); break;
    case 'csvOne': dl(`${(sName(adm.sel)||'student').replace(/\W+/g,'_')}_attempts.csv`,[['Student','Email','Date/time','Section','Topic','Case / set','Question','Question style','Mode','Correct (A)','Score (B)','Out of (B)','Time taken (s)','Allowed (s)','Marks by part (B)']].concat(filteredRows().map(x=>[sName(adm.sel),adm.sel.email,new Date(x.t).toLocaleString(),x.section||'A',x.topic,x.title,x.qLabel,x.qType,x.mode,x.section==='B'?'':(x.correct?'Yes':'No'),x.section==='B'?x.score:'',x.section==='B'?x.max:'',x.secs,x.allowed||'',x.parts||'']))); break;
  }
});
document.addEventListener('input',e=>{
  const pe=e.target&&e.target.dataset&&e.target.dataset.pedit; if(pe&&pdf.edit){ pdf.edit[pe]=e.target.value; return; }
  const k=e.target&&e.target.dataset&&e.target.dataset.admf; if(!k) return;
  const v=e.target.value;
  if(k==='q'){adm.q=v;renderList();} else if(k==='sort'){adm.sort=v;renderList();}
  else if(k==='fq'){adm.f.q=v;adm.limit=100;renderRows();} else if(k==='fsec'){adm.f.sec=v;adm.limit=100;renderRows();} else if(k==='ftopic'){adm.f.topic=v;adm.limit=100;renderRows();}
});

/* ---------- start ---------- */
try{
  const base='https://www.gstatic.com/firebasejs/10.14.1/';
  const [A,Au,Fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  FB={...A,...Au,...Fs};
  const app=FB.getApps().length?FB.getApps()[0]:FB.initializeApp(FIREBASE_CONFIG);
  auth=FB.getAuth(app); db=FB.getFirestore(app);
  FB.onAuthStateChanged(auth,onAuth);
}catch(e){ console.error(e); gate('Could not connect','Firebase failed to load: '+friendlyError(e),''); }
</script>
</body>
</html>
